name: MCP protocol exact source

on:
  pull_request:
    paths:
      - ".github/workflows/mcp-protocol-exact-source.yml"
      - "README.md"
      - "contracts/mcp-protocol.source.json"
      - "docs/COMPATIBILITY.md"
      - "docs/site/errors.mdx"
      - "docs/site/mcp-gateway.mdx"
      - "packages/python/pyproject.toml"
      - "packages/python/src/tempera_sdk/__init__.py"
      - "packages/python/src/tempera_sdk/errors.py"
      - "packages/python/src/tempera_sdk/mcp.py"
      - "packages/python/src/tempera_sdk/provider.py"
      - "packages/python/src/tempera_sdk/provider_capabilities.py"
      - "packages/python/src/tempera_sdk/surface.py"
      - "packages/python/tests/test_mcp.py"
      - "packages/python/tests/test_provider.py"
      - "packages/python/tests/test_provider_capabilities.py"
      - "packages/python/uv.lock"
      - "packages/rust/Cargo.lock"
      - "packages/rust/Cargo.toml"
      - "packages/rust/src/lib.rs"
      - "packages/rust/src/error.rs"
      - "packages/rust/examples/mcp_protocol_e2e.rs"
      - "packages/rust/src/mcp.rs"
      - "packages/rust/src/surface.rs"
      - "packages/typescript/src/index.d.ts"
      - "packages/typescript/src/index.js"
      - "packages/typescript/examples/mcp_protocol_e2e.mjs"
      - "packages/typescript/package.json"
      - "packages/typescript/src/errors.js"
      - "packages/typescript/src/mcp.js"
      - "packages/typescript/src/surface.js"
      - "packages/typescript/test/mcp.test.mjs"
      - "scripts/check-mcp-protocol-source.py"
      - "scripts/gen-sdk-docs.py"
      - "scripts/mcp-protocol-e2e.py"
      - "scripts/test-check-mcp-protocol-source.py"
      - "surface.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mcp-protocol-exact-source.yml"
      - "README.md"
      - "contracts/mcp-protocol.source.json"
      - "docs/COMPATIBILITY.md"
      - "docs/site/errors.mdx"
      - "docs/site/mcp-gateway.mdx"
      - "packages/python/pyproject.toml"
      - "packages/python/src/tempera_sdk/__init__.py"
      - "packages/python/src/tempera_sdk/errors.py"
      - "packages/python/src/tempera_sdk/mcp.py"
      - "packages/python/src/tempera_sdk/provider.py"
      - "packages/python/src/tempera_sdk/provider_capabilities.py"
      - "packages/python/src/tempera_sdk/surface.py"
      - "packages/python/tests/test_mcp.py"
      - "packages/python/tests/test_provider.py"
      - "packages/python/tests/test_provider_capabilities.py"
      - "packages/python/uv.lock"
      - "packages/rust/Cargo.lock"
      - "packages/rust/Cargo.toml"
      - "packages/rust/src/lib.rs"
      - "packages/rust/src/error.rs"
      - "packages/rust/examples/mcp_protocol_e2e.rs"
      - "packages/rust/src/mcp.rs"
      - "packages/rust/src/surface.rs"
      - "packages/typescript/src/index.d.ts"
      - "packages/typescript/src/index.js"
      - "packages/typescript/examples/mcp_protocol_e2e.mjs"
      - "packages/typescript/package.json"
      - "packages/typescript/src/errors.js"
      - "packages/typescript/src/mcp.js"
      - "packages/typescript/src/surface.js"
      - "packages/typescript/test/mcp.test.mjs"
      - "scripts/check-mcp-protocol-source.py"
      - "scripts/gen-sdk-docs.py"
      - "scripts/mcp-protocol-e2e.py"
      - "scripts/test-check-mcp-protocol-source.py"
      - "surface.json"

permissions:
  contents: read

jobs:
  client-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
      - name: Verify receipt policy and local protocol projection
        run: |
          python3 scripts/check-mcp-protocol-source.py
          python3 scripts/test-check-mcp-protocol-source.py
          PYTHONPATH=packages/python/src python3 -m unittest \
            packages/python/tests/test_mcp.py \
            packages/python/tests/test_provider.py \
            packages/python/tests/test_provider_capabilities.py
          node --check packages/typescript/examples/mcp_protocol_e2e.mjs
          node --test packages/typescript/test/mcp.test.mjs
          cargo +1.97.1 test --locked --manifest-path packages/rust/Cargo.toml mcp
          cargo +1.97.1 build --locked --manifest-path packages/rust/Cargo.toml \
            --example mcp_protocol_e2e

  exact-source-and-wire:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read allowlisted MCP source receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path("contracts/mcp-protocol.source.json").read_text())
          expected = {
              "source_repo": "tempera-dev/tempera-mcp",
              "source_branch": "main",
              "source_commit": "99ac544fcfbc500f212906a61cf6c72c2cc16723",
              "protocol_version": "2026-07-28",
              "lifecycle": "stateless-server-discover",
              "official_rust_sdk_repo": "modelcontextprotocol/rust-sdk",
              "official_rust_sdk_commit": "830e088d733c7964c806a2305760dd8deb30dff9",
              "official_rust_sdk_tree": "3a48da49ebd214faa55c22add021cc6d76568759",
          }
          for field, value in expected.items():
              if lock.get(field) != value:
                  raise SystemExit(f"refusing non-allowlisted {field}: {lock.get(field)!r}")
          commit = lock.get("source_commit", "")
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("source_commit must be a 40-character lowercase SHA")
          PY
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: modelcontextprotocol/rust-sdk
          ref: 830e088d733c7964c806a2305760dd8deb30dff9
          fetch-depth: 1
          path: .rmcp-source
          persist-credentials: false
      - name: Mint private MCP source reader token
        id: contract-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: tempera-mcp
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tempera-dev/tempera-mcp
          ref: main
          fetch-depth: 0
          path: .mcp-source
          persist-credentials: false
          token: ${{ steps.contract-reader.outputs.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.96.1
      - name: Verify exact source and three-language projection
        run: |
          python3 scripts/check-mcp-protocol-source.py \
            --source-root .mcp-source \
            --official-sdk-root .rmcp-source
          python3 scripts/test-check-mcp-protocol-source.py
          PYTHONPATH=packages/python/src python3 -m unittest packages/python/tests/test_mcp.py
          PYTHONPATH=packages/python/src python3 -m unittest \
            packages/python/tests/test_provider.py \
            packages/python/tests/test_provider_capabilities.py
          node --check packages/typescript/examples/mcp_protocol_e2e.mjs
          node --test packages/typescript/test/mcp.test.mjs
          cargo +1.97.1 test --locked --manifest-path packages/rust/Cargo.toml mcp
          cargo +1.97.1 build --locked --manifest-path packages/rust/Cargo.toml \
            --example mcp_protocol_e2e
      - name: Build exact MCP main and run cross-repo wire E2E
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
          PYTHONPATH: packages/python/src
        run: |
          cargo +1.96.1 build --locked --manifest-path .mcp-source/Cargo.toml --bin tempera-mcp
          python3 scripts/mcp-protocol-e2e.py \
            --binary .mcp-source/target/debug/tempera-mcp \
            --rust-client-binary packages/rust/target/debug/examples/mcp_protocol_e2e \
            --typescript-client-script packages/typescript/examples/mcp_protocol_e2e.mjs
