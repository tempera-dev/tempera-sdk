name: Contract updated

# Producers push; the SDK no longer polls. A producer whose merge to main
# changes its published contract fires a repository_dispatch here, and this
# workflow re-vendors at that exact commit, regenerates every language
# surface, runs the gates, and opens a pull request. Nobody copies a spec
# between repositories by hand, and no producer can be silently behind.
#
# The schedule is what makes this work today. Firing a repository_dispatch at
# tempera-sdk needs a credential with write access to this repository, and the
# only app installed org-wide -- tempera-contract-reader -- is read-only. Until
# an org administrator adds a write-capable app and publishes its client id and
# private key as organization secrets, producers cannot notify us, so the sweep
# below re-vendors every producer from its main every three hours. The
# repository_dispatch trigger is wired and validated regardless, so the moment
# that credential exists propagation becomes immediate with no change here.

on:
  repository_dispatch:
    types: [tempera-contract-updated]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      product:
        description: SDK product key, or empty for every product
        required: false
        type: string

permissions:
  contents: read

jobs:
  revendor:
    name: Re-vendor and regenerate
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # The dispatch payload is attacker-influenced in principle, so it is
      # validated against the committed registry before it reaches a checkout
      # or a token mint. An unknown product or a non-SHA commit stops here.
      - name: Resolve the requested product
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_PRODUCT: ${{ github.event.client_payload.product }}
          PAYLOAD_COMMIT: ${{ github.event.client_payload.commit }}
          INPUT_PRODUCT: ${{ inputs.product }}
        run: python3 scripts/resolve-contract-dispatch.py >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Mint contract reader tokens
        id: contract-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: ${{ steps.request.outputs.repositories }}

      - name: Re-vendor and regenerate
        env:
          PRODUCTS: ${{ steps.request.outputs.products }}
          COMMIT: ${{ steps.request.outputs.commit }}
          GH_TOKEN: ${{ steps.contract-reader.outputs.token }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/revendor-product.py --products "$PRODUCTS" --commit "$COMMIT"

      - name: Verify the regenerated surface
        run: npm test

      - name: Open a pull request when the surface moved
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTS: ${{ steps.request.outputs.products }}
        run: |
          if git diff --quiet; then
            echo "no contract movement; nothing to propose"
            exit 0
          fi
          branch="auto/contract-sync-$(date -u +%Y%m%dT%H%M%SZ)"
          git config user.name "tempera-contract-bot"
          git config user.email "noreply@tempera.dev"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore(sdk): re-vendor ${PRODUCTS} from published producer mains

          Generated by .github/workflows/contract-updated.yml. Every file in
          this commit is reproducible: re-run
          scripts/revendor-product.py --products \"${PRODUCTS}\"."
          git push -u origin "$branch"
          gh pr create \
            --title "chore(sdk): re-vendor ${PRODUCTS}" \
            --body "Automatic contract sync for \`${PRODUCTS}\`. The exact-source matrix reproduces every pinned commit; \`npm test\` passed before this pull request was opened." \
            --base main --head "$branch"
