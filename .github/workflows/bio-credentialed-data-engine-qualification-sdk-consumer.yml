name: Bio credentialed Data Engine qualification SDK consumer

on:
  pull_request:
    paths:
      - "contracts/bio-credentialed-data-engine-qualification-sdk.staging.lock.json"
      - "contracts/bio-credentialed-data-engine-qualification-sdk-consumer-verification.json"
      - "contracts/vendor/mcp/**"
      - "packages/python/src/tempera_sdk/bio_credentialed_data_engine_qualification.py"
      - "packages/python/tests/test_bio_credentialed_data_engine_qualification.py"
      - ".github/workflows/bio-credentialed-data-engine-qualification-sdk-consumer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install pinned verification tools
        run: python -m pip install --disable-pip-version-check "ruff==0.12.9" "mypy==1.17.1"
      - name: Ruff check
        run: ruff check packages/python/src/tempera_sdk/bio_credentialed_data_engine_qualification.py packages/python/tests/test_bio_credentialed_data_engine_qualification.py
      - name: Ruff format check
        run: ruff format --check packages/python/src/tempera_sdk/bio_credentialed_data_engine_qualification.py packages/python/tests/test_bio_credentialed_data_engine_qualification.py
      - name: Strict mypy
        run: mypy --strict packages/python/src/tempera_sdk/bio_credentialed_data_engine_qualification.py
      - name: Compile
        run: python -m compileall -q packages/python/src/tempera_sdk/bio_credentialed_data_engine_qualification.py packages/python/tests/test_bio_credentialed_data_engine_qualification.py
      - name: Test across independent hash seeds
        shell: bash
        run: |
          for seed in 1 2 97 211 99991; do
            PYTHONHASHSEED="$seed" python packages/python/tests/test_bio_credentialed_data_engine_qualification.py
          done
      - name: Deterministic receipt replay
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for seed in 1 2 97 211 99991; do
            PYTHONHASHSEED="$seed" python packages/python/src/tempera_sdk/bio_credentialed_data_engine_qualification.py > "$tmp/$seed.json"
            cmp "$tmp/$seed.json" contracts/bio-credentialed-data-engine-qualification-sdk-consumer-verification.json
          done
