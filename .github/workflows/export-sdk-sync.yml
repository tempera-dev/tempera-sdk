name: Export SDK sync worktree

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: tar --exclude=.git -czf /tmp/sdk-sync.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-sync-${{ github.sha }}
          path: /tmp/sdk-sync.tar.gz
          if-no-files-found: error
          retention-days: 1
