name: Tempera Voice source gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Do not expose the cross-repository reader token to pull-request code.
  tempera-voice-exact-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Read allowlisted Tempera Voice source lock
        id: voice-lock
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          lock = json.loads(
              Path("specs/tempera-voice-api.json.source").read_text(
                  encoding="utf-8"
              )
          )
          expected = {
              "source_repo": "tempera-dev/tempera-voice",
              "source_branch": "main",
              "source_path": "contracts/voice-api.openapi.json",
              "generated_path": "specs/tempera-voice-api.json",
              "generated_with": "source_lock.py@1+verbatim-openapi-copy",
          }
          for field, value in expected.items():
              if lock.get(field) != value:
                  raise SystemExit(
                      f"refusing non-allowlisted {field}: {lock.get(field)!r}"
                  )
          commit = lock.get("source_commit", "")
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("source_commit must be a 40-character lowercase SHA")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"commit={commit}\n")
          PY
      - name: Mint private Voice contract reader token
        id: contract-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: tempera-voice
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tempera-dev/tempera-voice
          ref: ${{ steps.voice-lock.outputs.commit }}
          fetch-depth: 0
          path: .tempera-voice-source
          token: ${{ steps.contract-reader.outputs.token }}
          persist-credentials: false
      - name: Confirm reader credentials are not persisted
        run: |
          test -z "$(git -C .tempera-voice-source config --local --get-regexp '^http\..*extraheader$' || true)"
          test -z "$(git -C .tempera-voice-source config --local --get-regexp '^credential\.' || true)"
          ! git -C .tempera-voice-source config --local --get remote.origin.url | grep -q '@'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Verify exact committed Tempera Voice source
        env:
          CONTRACT_READER_TOKEN: ${{ steps.contract-reader.outputs.token }}
        run: |
          reader_auth="$(printf 'x-access-token:%s' "$CONTRACT_READER_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $reader_auth" \
          git -C .tempera-voice-source fetch --no-tags origin main:refs/remotes/origin/main
          unset reader_auth CONTRACT_READER_TOKEN
          test -z "$(git -C .tempera-voice-source config --local --get-regexp '^http\..*extraheader$' || true)"
          test -z "$(git -C .tempera-voice-source config --local --get-regexp '^credential\.' || true)"
          ! git -C .tempera-voice-source config --local --get remote.origin.url | grep -q '@'
          python3 scripts/sync-vendored-openapi.py \
            --check \
            --product temperaVoice \
            --source-repo-dir .tempera-voice-source \
            --source-commit "${{ steps.voice-lock.outputs.commit }}"
