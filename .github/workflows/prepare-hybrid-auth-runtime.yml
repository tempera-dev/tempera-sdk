name: Prepare Hybrid Auth Runtime

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/prepare-hybrid-auth-runtime.yml"
      - "packages/auth-rust/**"
      - "scripts/fix-hybrid-auth-runtime.py"

permissions:
  contents: write

concurrency:
  group: prepare-hybrid-auth-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/hybrid-auth-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt,clippy
      - name: Format, lock, and test the runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix-hybrid-auth-runtime.py
          cargo fmt --manifest-path packages/auth-rust/Cargo.toml --all
          cargo generate-lockfile --manifest-path packages/auth-rust/Cargo.toml
          cargo clippy --manifest-path packages/auth-rust/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path packages/auth-rust/Cargo.toml
          rm scripts/fix-hybrid-auth-runtime.py
          rm .github/workflows/prepare-hybrid-auth-runtime.yml
      - name: Commit reproducible source
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare bounded hybrid auth runtime"
          git push origin "HEAD:${HEAD_BRANCH}"
