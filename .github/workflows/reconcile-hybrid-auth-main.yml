name: Reconcile Hybrid Auth Onto Main

on:
  push:
    branches: [agent/hybrid-auth-runtime]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/hybrid-auth-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt,clippy
      - name: Merge current main and regenerate combined producer surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main:refs/remotes/origin/main
          echo "MAIN_SHA=$(git rev-parse refs/remotes/origin/main)"
          set +e
          git merge --no-commit --no-ff refs/remotes/origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected=$'docs/site/authentication.mdx\npackages/python/tests/test_sdk.py\npackages/typescript/test/sdk.test.mjs'
            test "$conflicts" = "$expected"
            git checkout --theirs -- \
              docs/site/authentication.mdx \
              packages/python/tests/test_sdk.py \
              packages/typescript/test/sdk.test.mjs
            git add \
              docs/site/authentication.mdx \
              packages/python/tests/test_sdk.py \
              packages/typescript/test/sdk.test.mjs
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
          test "$(python3 -c 'import json; print(json.load(open("specs/control-plane.openapi.json.source"))["source_commit"])')" = "93755981bb7ed3002b947be1889683e35846d9e1"
          python3 scripts/sync-openapi-surface.py --product controlPlane
          python3 scripts/gen-sdk-surface.py
          python3 scripts/gen-sdk-docs.py
          rm -f .github/workflows/probe-hybrid-main-merge.yml
          rm -f .github/workflows/reconcile-hybrid-auth-main.yml
          npm test
          cargo fmt --manifest-path packages/auth-rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path packages/auth-rust/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path packages/auth-rust/Cargo.toml --locked
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Reconcile hybrid auth with current SDK main"
          git push origin HEAD:agent/hybrid-auth-runtime
