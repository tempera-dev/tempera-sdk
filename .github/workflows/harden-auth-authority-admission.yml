name: Harden Auth Authority Admission

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/harden-auth-authority-admission.yml"
      - "scripts/harden-auth-authority-admission.py"
      - "packages/auth-rust/**"

permissions:
  contents: write

concurrency:
  group: harden-auth-authority-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/auth-runtime-authority-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt,clippy
      - name: Apply and validate authority admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/harden-auth-authority-admission.py")
          text = path.read_text(encoding="utf-8")
          old = '''        let now = Instant::now();
          {
              let cache = self.jwks.lock().await;
              if let Some(key) = lookup_jwks_key(
                  &cache,
                  kid,
                  now,
                  self.config.jwks_refresh_cooldown,
              )? {
                  return Ok(key);
              }
          }
          '''
          new = '''        {
              let cache = self.jwks.lock().await;
              if cache.expires_at.is_some_and(|expiry| expiry > Instant::now())
                  && let Some(key) = cache.keys.get(kid)
              {
                  return Ok(key.key.clone());
              }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"JWKS fast-path transformer changed: found {text.count(old)} blocks")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/harden-auth-authority-admission.py
          cargo fmt --manifest-path packages/auth-rust/Cargo.toml --all
          cargo clippy --manifest-path packages/auth-rust/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path packages/auth-rust/Cargo.toml --locked
          rm scripts/harden-auth-authority-admission.py
          rm .github/workflows/harden-auth-authority-admission.yml
      - name: Commit validated authority admission
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bound Auth Hub authority concurrency"
          git push origin "HEAD:${HEAD_BRANCH}"
