name: land-voice-exact-source

on:
  pull_request:
    paths: [.github/workflows/land-voice-exact-source.yml]

permissions:
  contents: read

jobs:
  land:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Mint scoped Voice writer token
        id: writer
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: tempera-voice
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          repository: tempera-dev/tempera-voice
          ref: agent/aip-update-voice-agent-v2
          fetch-depth: 0
          path: .voice-source
          token: ${{ steps.writer.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .voice-source/pyproject.toml
      - name: Prove exact producer head
        working-directory: .voice-source
        run: |
          test "$(git rev-parse HEAD)" = d2c6ff2a20813ef4ea9bc5fa3a4ad14d4bd5b8ad
          git fetch --no-tags origin agent/aip-update-voice-agent-v2:refs/remotes/origin/agent/aip-update-voice-agent-v2
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/agent/aip-update-voice-agent-v2)"
      - name: Install and materialize exact candidate
        working-directory: .voice-source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python scripts/apply-agent-aip-update.py
          PYTHONPATH=src python scripts/export-openapi.py
      - name: Revalidate exact candidate
        working-directory: .voice-source
        run: |
          python -m compileall -q src tests
          ruff check src tests
          pytest
          PYTHONPATH=src python scripts/export-openapi.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path('contracts/voice-api.openapi.json').read_text())
          assert '/v1/agents/{agent_id}' not in spec['paths']
          methods = spec['paths']['/v1/agents/{agentId}']
          assert 'patch' in methods and 'put' not in methods
          op = methods['patch']
          assert op['operationId'] == 'updateVoiceAgent'
          params = {(p['name'], p['in']): p for p in op.get('parameters', [])}
          assert params[('updateMask', 'query')]['required'] is True
          PY
      - name: Stage only permanent producer files
        working-directory: .voice-source
        run: |
          rm scripts/apply-agent-aip-update.py
          git add src/tempera_voice/app.py tests/test_openapi_auth_contract.py tests/test_agent_update_api.py tests/test_http_concurrency.py tests/conftest.py contracts/voice-api.openapi.json scripts/apply-agent-aip-update.py
          python - <<'PY'
          import subprocess
          allowed = {
              'src/tempera_voice/app.py',
              'tests/test_openapi_auth_contract.py',
              'tests/test_agent_update_api.py',
              'tests/test_http_concurrency.py',
              'tests/conftest.py',
              'contracts/voice-api.openapi.json',
              'scripts/apply-agent-aip-update.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if not changed:
              raise SystemExit('no permanent Voice producer change to land')
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected staged files: {sorted(unexpected)}')
          required = {'src/tempera_voice/app.py', 'tests/test_openapi_auth_contract.py', 'contracts/voice-api.openapi.json', 'scripts/apply-agent-aip-update.py'}
          missing = required - changed
          if missing:
              raise SystemExit(f'missing required product changes: {sorted(missing)}')
          PY
      - name: Commit and push exact producer source
        working-directory: .voice-source
        run: |
          git config user.name 'tempera-voice-aip'
          git config user.email 'tempera-voice-aip@users.noreply.github.com'
          git commit -m 'feat(api): migrate voice agent updates to AIP-161 PATCH'
          git push origin HEAD:agent/aip-update-voice-agent-v2
