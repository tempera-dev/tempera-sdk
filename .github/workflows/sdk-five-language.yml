name: SDK five-language contract

on:
  pull_request:
    paths:
      - surface.json
      - sdk.toml
      - packages/typescript/**
      - packages/python/**
      - packages/rust/**
      - packages/go/**
      - packages/c/**
      - scripts/gen-sdk-go-c.py
      - scripts/check-five-language-uniformity.py
      - scripts/check-aip-conformance.py
      - .github/workflows/sdk-five-language.yml
  push:
    branches: [main]
    paths:
      - surface.json
      - sdk.toml
      - packages/**
      - scripts/gen-sdk-go-c.py
      - scripts/check-five-language-uniformity.py
      - scripts/check-aip-conformance.py

permissions:
  contents: read

jobs:
  five-language:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - name: Generated surface drift
        run: |
          python3 scripts/gen-sdk-surface.py --check
          python3 scripts/gen-sdk-go-c.py --check
          python3 scripts/check-five-language-uniformity.py
      - name: TypeScript
        run: npm --prefix packages/typescript test
      - name: Python
        run: PYTHONPATH=packages/python/src python3 -m unittest discover -s packages/python/tests
      - name: Rust
        run: |
          cargo fmt --manifest-path packages/rust/Cargo.toml -- --check
          cargo check --manifest-path packages/rust/Cargo.toml --all-targets
          cargo clippy --manifest-path packages/rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path packages/rust/Cargo.toml
      - name: Go
        working-directory: packages/go
        run: go test ./...
      - name: C
        run: make -C packages/c test
