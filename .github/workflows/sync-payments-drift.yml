name: Sync current Payments contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/sync-auth-hub-security' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Mint Payments contract reader
        id: contract-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: tempera-payments
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tempera-dev/tempera-payments
          ref: e1e9ca92bf64b00197bef4ee275aac560c5783e9
          fetch-depth: 0
          path: .payments-source
          token: ${{ steps.contract-reader.outputs.token }}
      - name: Verify and synchronize exact Payments source
        run: |
          git -C .payments-source fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git -C .payments-source rev-parse HEAD)" = "$(git -C .payments-source rev-parse refs/remotes/origin/main)"
          python3 scripts/sync-vendored-openapi.py --product temperaPayments --source-repo-dir .payments-source --source-branch main --source-commit e1e9ca92bf64b00197bef4ee275aac560c5783e9
          python3 scripts/sync-openapi-surface.py --product temperaPayments
          python3 scripts/gen-sdk-surface.py
          python3 scripts/gen-sdk-docs.py
      - name: Validate aggregate SDK
        run: |
          npm test
          git diff --check
      - name: Remove one-shot source and workflow
        run: rm -rf .payments-source .github/workflows/sync-payments-drift.yml .github/workflows/export-sdk-sync.yml
      - name: Commit synchronized SDK surface
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Sync hardened Auth Hub and current Payments contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

# synchronize trigger
