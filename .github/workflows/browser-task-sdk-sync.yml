name: browser-task-sdk-sync

on:
  push:
    branches: [agent/browser-task-workflow-sdk]
    paths:
      - .github/workflows/browser-task-sdk-sync.yml

permissions:
  contents: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/browser-task-workflow-sdk
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: tempera-dev/tempo
          ref: aa60c133c4567be95aab42b144606d97e3e18d33
          path: _tempo
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      # This workflow is temporary and branch-scoped; it exists only to produce
      # an exact staged Tempo contract receipt without unrelated source-gap gates.
      - name: Vendor exact staged Tempo contract
        run: |
          python3 scripts/sync-vendored-openapi.py \
            --product tempo \
            --source-repo-dir _tempo \
            --source-branch agent/tempo-servo-runtime-reconcile \
            --source-commit aa60c133c4567be95aab42b144606d97e3e18d33
          python3 scripts/sync-openapi-surface.py --product tempo
          python3 scripts/gen-sdk-surface.py
          python3 scripts/gen-sdk-docs.py
      - name: Validate browser task SDKs
        run: |
          npm --prefix packages/typescript test
          PYTHONPATH=packages/python/src python3 -m unittest discover -s packages/python/tests
          cargo fmt --manifest-path packages/rust/Cargo.toml -- --check
          cargo check --manifest-path packages/rust/Cargo.toml --all-targets
          cargo clippy --manifest-path packages/rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path packages/rust/Cargo.toml
      - name: Check generated contract surface
        run: |
          python3 scripts/sync-openapi-surface.py --product tempo --check
          python3 scripts/check-aip-conformance.py
      - name: Remove staged producer checkout
        run: rm -rf _tempo
      - name: Commit synchronized SDK surface
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git config user.name 'tempera-sdk-sync'
          git config user.email 'tempera-sdk-sync@users.noreply.github.com'
          git add specs/tempo-openapi.json specs/tempo-openapi.json.source surface.json packages/typescript/src/surface.js packages/typescript/src/surface.d.ts packages/python/src/tempera_sdk/surface.py packages/rust/src/surface.rs docs/site
          git commit -m 'chore(sdk): sync staged Tempo browser contract'
          git push origin HEAD:agent/browser-task-workflow-sdk
