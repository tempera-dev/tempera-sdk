name: Refresh Voice SDK from merged producers

on:
  push:
    branches: [agent/tempera-voice-sdk]

permissions:
  contents: write

concurrency:
  group: voice-main-source-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Mint private contract reader token
        id: contract-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: auth-hub,tempera-voice
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tempera-dev/auth-hub
          ref: main
          fetch-depth: 0
          path: .auth-source
          token: ${{ steps.contract-reader.outputs.token }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tempera-dev/tempera-voice
          ref: main
          fetch-depth: 0
          path: .voice-source
          token: ${{ steps.contract-reader.outputs.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Refresh exact merged producer contracts
        shell: bash
        run: |
          set -euo pipefail
          AUTH_COMMIT="$(git -C .auth-source rev-parse HEAD)"
          VOICE_COMMIT="$(git -C .voice-source rev-parse HEAD)"
          python3 scripts/sync-control-plane-openapi.py \
            --source-repo-dir .auth-source \
            --source-branch main \
            --source-commit "$AUTH_COMMIT"
          python3 scripts/sync-vendored-openapi.py \
            --product temperaVoice \
            --source-repo-dir .voice-source \
            --source-branch main \
            --source-commit "$VOICE_COMMIT"
          python3 scripts/sync-openapi-surface.py --product controlPlane --product temperaVoice
          python3 scripts/gen-sdk-surface.py
          python3 scripts/gen-sdk-docs.py
      - name: Verify merged source and generated contracts
        shell: bash
        run: |
          set -euo pipefail
          AUTH_COMMIT="$(git -C .auth-source rev-parse HEAD)"
          VOICE_COMMIT="$(git -C .voice-source rev-parse HEAD)"
          python3 scripts/sync-control-plane-openapi.py --check \
            --source-repo-dir .auth-source \
            --source-branch main \
            --source-commit "$AUTH_COMMIT"
          python3 scripts/sync-vendored-openapi.py --check \
            --product temperaVoice \
            --source-repo-dir .voice-source \
            --source-branch main \
            --source-commit "$VOICE_COMMIT"
          python3 scripts/test-sync-data-engine-openapi.py
          python3 scripts/test-sync-openapi-surface.py
          python3 scripts/test-sdk-names.py
          python3 scripts/test-aip-conformance.py
          python3 scripts/check-aip-conformance.py
          python3 scripts/check-exact-source-gaps.py
          python3 scripts/check-upstream-drift.py
          python3 scripts/check-sdk-surface.py
          python3 scripts/gen-sdk-surface.py --check
          python3 scripts/gen-sdk-docs.py --check
      - name: Verify language clients
        run: |
          npm --prefix packages/typescript test
          PYTHONPATH=packages/python/src python3 -m unittest discover -s packages/python/tests
          cargo test --manifest-path packages/rust/Cargo.toml
      - name: Remove one-shot refresher
        run: rm .github/workflows/voice-main-source-refresh.yml
      - name: Publish merged-source refresh
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .auth-source .voice-source
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh Voice SDK from merged producers'
          git push origin HEAD:${{ github.ref_name }}
