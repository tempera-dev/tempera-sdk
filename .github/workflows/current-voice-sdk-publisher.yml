name: current-voice-sdk-publisher

on:
  push:
    branches: [agent/register-tempera-voice-sdk]
    paths:
      - scripts/apply-current-voice-source-lock.py
      - .github/workflows/current-voice-sdk-publisher.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/register-tempera-voice-sdk
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Mint exact-source reader
        id: contract-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: tempera-voice
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: tempera-dev/tempera-voice
          ref: 3a3e1219e5fe99d0de4da0a97ad3050b1b7e4ce1
          fetch-depth: 0
          path: .tempera-voice-source
          token: ${{ steps.contract-reader.outputs.token }}
      - name: Verify merged Voice source
        run: |
          git -C .tempera-voice-source fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git -C .tempera-voice-source rev-parse HEAD)" = "3a3e1219e5fe99d0de4da0a97ad3050b1b7e4ce1"
          test "$(git -C .tempera-voice-source rev-parse refs/remotes/origin/main)" = "3a3e1219e5fe99d0de4da0a97ad3050b1b7e4ce1"
      - name: Refresh strict Voice SDK contract
        run: |
          python scripts/apply-current-voice-source-lock.py
          python scripts/sync-vendored-openapi.py \
            --product temperaVoice \
            --source-repo-dir .tempera-voice-source \
            --source-commit 3a3e1219e5fe99d0de4da0a97ad3050b1b7e4ce1
          python scripts/sync-openapi-surface.py --product temperaVoice
          python scripts/gen-sdk-surface.py
          python scripts/gen-sdk-docs.py
      - name: Validate generated and exact-source state
        run: |
          python -m compileall -q scripts packages/python/src
          python scripts/test-sync-vendored-openapi.py
          python scripts/test-upstream-drift.py
          python scripts/sync-openapi-surface.py --product temperaVoice --check
          python scripts/sync-vendored-openapi.py \
            --check \
            --product temperaVoice \
            --source-repo-dir .tempera-voice-source \
            --source-commit 3a3e1219e5fe99d0de4da0a97ad3050b1b7e4ce1
          python scripts/check-upstream-drift.py
          python scripts/check-sdk-surface.py
          git diff --check
      - name: Publish current Voice SDK projection
        run: |
          if git diff --quiet; then
            echo "Voice SDK source lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-upstream-drift.py specs surface.json packages docs
          git commit -m "Refresh SDK to optimized Voice main"
          git push origin HEAD:agent/register-tempera-voice-sdk
