name: SDK five-language bootstrap

on:
  pull_request:
    paths:
      - .github/workflows/sdk-five-language-bootstrap.yml
      - scripts/gen-sdk-go-c.py
      - packages/go/**
      - packages/c/**
      - packages/rust/**

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.23.x', cache: false }
      - uses: dtolnay/rust-toolchain@1.97.1
        with: { components: 'clippy,rustfmt' }
      - name: Generate surfaces and format source
        run: |
          python3 scripts/gen-sdk-go-c.py
          gofmt -w packages/go/client.go packages/go/browser.go packages/go/client_test.go
          cargo fmt --manifest-path packages/rust/Cargo.toml
      - name: Validate generated surfaces and AIP
        run: |
          python3 scripts/gen-sdk-surface.py --check
          python3 scripts/gen-sdk-go-c.py --check
          python3 scripts/test-aip-conformance.py
          python3 scripts/check-aip-conformance.py
      - name: Validate TypeScript
        run: npm --prefix packages/typescript test
      - name: Validate Python
        run: PYTHONPATH=packages/python/src python3 -m unittest discover -s packages/python/tests
      - name: Validate Rust
        run: |
          cargo fmt --manifest-path packages/rust/Cargo.toml -- --check
          cargo check --manifest-path packages/rust/Cargo.toml --all-targets
          cargo clippy --manifest-path packages/rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path packages/rust/Cargo.toml
      - name: Validate Go
        working-directory: packages/go
        run: go test ./...
      - name: Validate C
        run: make -C packages/c test
      - name: Push generated and formatting changes only after all gates pass
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'tempera-sdk-sync'
          git config user.email 'tempera-sdk-sync@users.noreply.github.com'
          git add packages/go packages/c/include/tempera/surface_gen.h packages/c/src/surface_gen.c packages/rust
          git commit -m 'chore(sdk): qualify five-language generated surfaces'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
