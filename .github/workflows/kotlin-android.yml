name: Kotlin Android SDK

on:
  pull_request:
    paths:
      - "packages/kotlin/**"
      - "packages/kotlin-android/**"
      - "scripts/check-kotlin-android-artifact.py"
      - "scripts/test-check-kotlin-android-artifact.py"
      - ".github/workflows/kotlin-android.yml"
  push:
    branches: [main]
    paths:
      - "packages/kotlin/**"
      - "packages/kotlin-android/**"
      - "scripts/check-kotlin-android-artifact.py"
      - "scripts/test-check-kotlin-android-artifact.py"
      - ".github/workflows/kotlin-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
        with:
          gradle-version: "8.11.1"
      - name: Preserve Kotlin/JVM SDK compatibility tests
        run: gradle -p packages/kotlin test

  android-library-and-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
        with:
          gradle-version: "8.11.1"
      - name: JVM and Android publications for capability fixture
        env:
          FIXTURE_REPOSITORY: ${{ runner.temp }}/tempera-sdk-fixture-repository
        run: |
          gradle -p packages/kotlin -PfixtureRepository="$FIXTURE_REPOSITORY" publishMavenJavaPublicationToFixtureRepository
          gradle -p packages/kotlin-android -PfixtureRepository="$FIXTURE_REPOSITORY" publishFixturePublication :fixture-app:verifyRuntimeVariantConflict
      - name: Android unit, Debug fixture, and minified Release fixture
        run: |
          gradle -p packages/kotlin-android testDebugUnitTest testReleaseUnitTest lintRelease assembleDebug :fixture-app:assembleDebug :fixture-app:assembleRelease
      - name: Minified Release instrumentation APK and annotation classpath
        run: |
          gradle -p packages/kotlin-android -PfixtureTestBuildType=release :fixture-app:verifyReleaseTestAnnotationClasspath :fixture-app:assembleReleaseAndroidTest
      - name: Verify published AAR and Android API closure
        run: |
          python3 scripts/test-check-kotlin-android-artifact.py
          python3 scripts/check-kotlin-android-artifact.py --aar packages/kotlin-android/build/outputs/aar/tempera-sdk-kotlin-android-release.aar --min-sdk 26
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-android-library-artifacts
          path: |
            packages/kotlin-android/build/outputs/
            packages/kotlin-android/fixture-app/build/outputs/
            packages/kotlin-android/**/build/reports/

  android-runtime:
    needs: android-library-and-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve hosted runner space for Android userdata
        run: |
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -L /usr/share/dotnet
          df -h "$HOME"
          # This disposable Ubuntu job uses Java/Android, never .NET.
          if [ -d /usr/share/dotnet ]; then
            sudo du -sh /usr/share/dotnet
            sudo rm -rf -- /usr/share/dotnet
          fi
          df -h "$HOME"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2G
          pre-emulator-launch-script: |
            df -h "$HOME"
            test "$(df -Pk "$HOME" | awk 'NR == 2 {print $4}')" -ge 8388608 || { echo "Insufficient hosted AVD space: need at least 8 GiB after image installation" >&2; exit 1; }
          disable-animations: true
          script: |
            gradle -p packages/kotlin-android -PfixtureTestBuildType=debug -Pandroid.testInstrumentationRunnerArguments.temperaExpectedApi=${{ matrix.api-level }} :fixture-app:connectedDebugAndroidTest
            gradle -p packages/kotlin-android -PfixtureTestBuildType=release -Pandroid.testInstrumentationRunnerArguments.temperaExpectedApi=${{ matrix.api-level }} :fixture-app:connectedReleaseAndroidTest
      - name: Require Debug and minified Release runtime execution
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("packages/kotlin-android/fixture-app/build/outputs/androidTest-results/connected")
          for variant in ("debug", "release"):
              reports = list((root / variant).glob("TEST-*.xml"))
              assert len(reports) == 1, f"Expected one {variant} device report, got {reports}"
              suite = ET.parse(reports[0]).getroot()
              assert suite.get("tests") == "1", f"{variant} did not execute the expected test"
              assert all(suite.get(key) == "0" for key in ("failures", "errors", "skipped")), f"{variant} has failure/error/skip"
              cases = suite.findall("testcase")
              assert len(cases) == 1 and cases[0].get("classname") == "dev.tempera.sdk.fixture.AndroidSdkRuntimeTest"
              assert cases[0].get("name") == "authMcpAndBaseJsonClassesLoadOnDevice"
              assert not any(cases[0].find(tag) is not None for tag in ("failure", "error", "skipped"))
              print(f"{variant}: expected SDK loopback executed once with no failures or skips")
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-android-runtime-api-${{ matrix.api-level }}
          path: |
            packages/kotlin-android/fixture-app/build/reports/
            packages/kotlin-android/fixture-app/build/outputs/androidTest-results/
            packages/kotlin-android/fixture-app/build/outputs/apk/
