name: sdk-five-language-sync

on:
  push:
    branches: [agent/browser-task-workflow-sdk]
    paths: [.github/workflows/sdk-five-language-sync.yml]

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/browser-task-workflow-sdk
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      # Bootstrap run 2: generated artifacts are committed only after all five SDKs validate.
      - name: Generate Go and C surfaces
        run: |
          python3 scripts/gen-sdk-go-c.py
          gofmt -w packages/go/*.go
      - name: Validate canonical manifest and AIP contract
        run: |
          python3 scripts/gen-sdk-surface.py --check
          python3 scripts/gen-sdk-go-c.py --check
          python3 scripts/test-aip-conformance.py
          python3 scripts/check-aip-conformance.py
      - name: Validate TypeScript
        run: npm --prefix packages/typescript test
      - name: Validate Python
        run: PYTHONPATH=packages/python/src python3 -m unittest discover -s packages/python/tests
      - name: Validate Rust
        run: |
          cargo fmt --manifest-path packages/rust/Cargo.toml -- --check
          cargo check --manifest-path packages/rust/Cargo.toml --all-targets
          cargo clippy --manifest-path packages/rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path packages/rust/Cargo.toml
      - name: Validate Go
        working-directory: packages/go
        run: go test ./...
      - name: Validate C
        run: make -C packages/c test
      - name: Commit generated Go/C surfaces
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'tempera-sdk-sync'
          git config user.email 'tempera-sdk-sync@users.noreply.github.com'
          git add packages/go packages/c/include/tempera/surface_gen.h packages/c/src/surface_gen.c
          git commit -m 'chore(sdk): generate Go and C contract surfaces'
          git push origin HEAD:agent/browser-task-workflow-sdk
