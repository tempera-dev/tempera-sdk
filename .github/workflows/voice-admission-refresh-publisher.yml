name: Voice admission source refresh publisher

on:
  push:
    branches: [agent/voice-admission-source-refresh]
    paths:
      - .github/workflows/voice-admission-refresh-publisher.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/voice-admission-source-refresh
          fetch-depth: 0
      - name: Mint Voice contract reader token
        id: contract-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: tempera-voice
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: tempera-dev/tempera-voice
          ref: e7a664812aa9a50b413cb1d33edbef7df9a4f764
          fetch-depth: 0
          path: .tempera-voice-source
          token: ${{ steps.contract-reader.outputs.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-vendor and generate exact Voice surface
        run: |
          git -C .tempera-voice-source fetch --no-tags origin main:refs/remotes/origin/main
          python3 scripts/sync-vendored-openapi.py \
            --product temperaVoice \
            --source-repo-dir .tempera-voice-source \
            --source-commit e7a664812aa9a50b413cb1d33edbef7df9a4f764
          python3 scripts/sync-openapi-surface.py --product temperaVoice
          python3 scripts/gen-sdk-surface.py
          python3 scripts/check-sdk-surface.py
          python3 scripts/test-sync-openapi-surface.py
          python3 scripts/check-exact-source-gaps.py
          git diff --check
      - name: Publish generated SDK refresh
        run: |
          rm -rf .tempera-voice-source
          if git diff --quiet; then
            echo 'Voice SDK source is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/tempera-voice-api.json specs/tempera-voice-api.json.source surface.json packages/typescript/src/surface.js packages/python/src/tempera_sdk/surface.py packages/rust/src/surface.rs
          git commit -m 'Refresh SDK from Voice admission contract'
          git push origin HEAD:agent/voice-admission-source-refresh
