name: Prepare Auth Transport Boundary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/prepare-auth-transport-boundary.yml"
      - "scripts/make-auth-transport-optional.py"
      - "packages/auth-rust/**"

permissions:
  contents: write

concurrency:
  group: prepare-auth-transport-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/auth-runtime-transport-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt,clippy
      - name: Apply and prove transport split
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/make-auth-transport-optional.py
          cargo fmt --manifest-path packages/auth-rust/Cargo.toml --all
          cargo clippy --manifest-path packages/auth-rust/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path packages/auth-rust/Cargo.toml --locked --all-features
          cargo check --manifest-path packages/auth-rust/Cargo.toml --locked --no-default-features
          cargo clippy --manifest-path packages/auth-rust/Cargo.toml --locked --no-default-features --lib -- -D warnings
          rm scripts/make-auth-transport-optional.py
          rm .github/workflows/prepare-auth-transport-boundary.yml
      - name: Commit validated transport boundary
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make Auth Hub transport optional"
          git push origin "HEAD:${HEAD_BRANCH}"
