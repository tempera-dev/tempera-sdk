name: Harden Hybrid Auth Runtime

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/harden-hybrid-auth-runtime.yml"
      - "scripts/harden-hybrid-auth-runtime.py"
      - "packages/auth-rust/**"

permissions:
  contents: write

concurrency:
  group: harden-hybrid-auth-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/hybrid-auth-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt,clippy
      - name: Apply and validate final authority hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/harden-hybrid-auth-runtime.py
          python3 - <<'PY'
          from pathlib import Path
          hardening = Path('packages/auth-rust/tests/hardening.rs')
          text = hardening.read_text()
          if not text.startswith('//!'):
              hardening.write_text('//! Adversarial configuration tests for the hybrid authorization runtime.\n\n' + text)

          hybrid = Path('packages/auth-rust/tests/hybrid.rs')
          text = hybrid.read_text().replace('http://auth.test', 'http://127.0.0.1:8080')
          old = '''    let secure = Config::new(
        "https://api.tempera.dev",
        "tempera-document",
        "https://api.tempera.dev/.well-known/jwks.json",
        "https://api.tempera.dev/v1/oauth/introspect",
    );
    assert!(secure.validate().is_ok());'''
          new = '''    let mut secure = Config::new(
        "https://api.tempera.dev",
        "tempera-document",
        "https://api.tempera.dev/.well-known/jwks.json",
        "https://api.tempera.dev/v1/oauth/introspect",
    );
    secure.introspection_secret = Some("resource-server-secret".into());
    assert!(secure.validate().is_ok());'''
          if text.count(old) != 1:
              raise SystemExit('secure fixture: expected exactly one match')
          hybrid.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --manifest-path packages/auth-rust/Cargo.toml --all
          cargo clippy --manifest-path packages/auth-rust/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path packages/auth-rust/Cargo.toml --locked
          rm scripts/harden-hybrid-auth-runtime.py
          rm .github/workflows/harden-hybrid-auth-runtime.yml
      - name: Commit validated runtime
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden hybrid authority boundaries"
          git push origin "HEAD:${HEAD_BRANCH}"
