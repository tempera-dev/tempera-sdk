name: Finalize Hybrid Auth Runtime

on:
  push:
    branches:
      - agent/hybrid-auth-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-hybrid-auth-runtime
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'tempera-dev/tempera-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/hybrid-auth-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt,clippy
      - name: Apply hardening once and align legacy fixtures
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'DEFAULT_MAX_ACCESS_TOKEN_LIFETIME_SECONDS' packages/auth-rust/src/lib.rs; then
            python3 scripts/harden-hybrid-auth-runtime.py
          fi
          python3 - <<'PY'
          from pathlib import Path

          hybrid = Path('packages/auth-rust/tests/hybrid.rs')
          text = hybrid.read_text()
          text = text.replace('http://auth.test', 'http://127.0.0.1')
          old = '''    let secure = Config::new(
              "https://api.tempera.dev",
              "tempera-document",
              "https://api.tempera.dev/.well-known/jwks.json",
              "https://api.tempera.dev/v1/oauth/introspect",
          );
          assert!(secure.validate().is_ok());
          '''
          new = '''    let mut secure = Config::new(
              "https://api.tempera.dev",
              "tempera-document",
              "https://api.tempera.dev/.well-known/jwks.json",
              "https://api.tempera.dev/v1/oauth/introspect",
          );
          secure.introspection_secret = Some("resource-server-secret".into());
          assert!(secure.validate().is_ok());
          '''
          if old in text:
              text = text.replace(old, new, 1)
          hybrid.write_text(text)

          hardening = Path('packages/auth-rust/tests/hardening.rs')
          if hardening.exists():
              text = hardening.read_text()
              if not text.startswith('//!'):
                  hardening.write_text(
                      '//! Adversarial configuration tests for the hybrid authorization runtime.\n\n'
                      + text
                  )
          PY
      - name: Strict runtime validation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path packages/auth-rust/Cargo.toml --all
          cargo clippy --manifest-path packages/auth-rust/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path packages/auth-rust/Cargo.toml --locked
      - name: Remove preparation machinery and commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/harden-hybrid-auth-runtime.py
          rm -f .github/workflows/harden-hybrid-auth-runtime.yml
          rm -f .github/workflows/finalize-hybrid-auth-runtime.yml
          rm -f packages/auth-rust/tests/.hardening-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "runtime already finalized"
          else
            git commit -m "Finalize hardened hybrid auth runtime"
            git push origin HEAD:agent/hybrid-auth-runtime
          fi
