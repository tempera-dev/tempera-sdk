name: test

on:
  pull_request:
  push:
    branches: [main]
  # Lets a maintainer re-run the whole gate set against a branch without
  # pushing an empty commit.
  workflow_dispatch:

jobs:
  data-engine-exact-source:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Read allowlisted Data Engine source lock
        id: data-engine-lock
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          lock = json.loads(
              Path("contracts/data-engine-openapi-operations.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = {
              "source_repo": "tempera-dev/data-engine",
              "source_branch": "main",
              "source_path": "contracts/openapi/data-engine.openapi.json",
          }
          for field, value in expected.items():
              if lock.get(field) != value:
                  raise SystemExit(
                  f"refusing non-allowlisted {field}: {lock.get(field)!r}"
              )
          commit = lock.get("source_commit", "")
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("source_commit must be a 40-character lowercase SHA")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"commit={commit}\n")
          PY
      - name: Mint private contract reader token
        id: contract-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: data-engine
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tempera-dev/data-engine
          ref: ${{ steps.data-engine-lock.outputs.commit }}
          fetch-depth: 0
          path: .data-engine-source
          token: ${{ steps.contract-reader.outputs.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Verify exact committed Data Engine source
        run: |
          git -C .data-engine-source fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git -C .data-engine-source rev-parse HEAD)" = "$(git -C .data-engine-source rev-parse refs/remotes/origin/main)"
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/test-sync-vendored-openapi.py
          python3 scripts/sync-vendored-openapi.py --check --product dataEngine --source-repo-dir .data-engine-source --source-commit "${{ steps.data-engine-lock.outputs.commit }}"
          python3 scripts/sync-data-engine-openapi.py --check --source .data-engine-source/contracts/openapi/data-engine.openapi.json --source-repo tempera-dev/data-engine --source-branch main --source-commit "${{ steps.data-engine-lock.outputs.commit }}"
          python3 scripts/sync-data-engine-mcp-contracts.py --check --source-repo-dir .data-engine-source --source-branch main --source-commit "${{ steps.data-engine-lock.outputs.commit }}"

  auth-hub-exact-source:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Read allowlisted Auth Hub source lock
        id: auth-hub-lock
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          lock = json.loads(
              Path("specs/control-plane.openapi.json.source").read_text(
                  encoding="utf-8"
              )
          )
          expected = {
              "source_repo": "tempera-dev/auth-hub",
              "source_branch": "main",
              "source_path": "contracts/control-plane.openapi.json",
          }
          for field, value in expected.items():
              if lock.get(field) != value:
                  raise SystemExit(
                      f"refusing non-allowlisted {field}: {lock.get(field)!r}"
                  )
          commit = lock.get("source_commit", "")
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("source_commit must be a 40-character lowercase SHA")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"commit={commit}\n")
          PY
      - name: Mint private contract reader token
        # All matrix producers, including Bio, Human Data, Remi, and Tempo, are
        # covered by the organization-wide least-privilege installation.
        id: contract-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: auth-hub
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tempera-dev/auth-hub
          ref: ${{ steps.auth-hub-lock.outputs.commit }}
          fetch-depth: 0
          path: .auth-hub-source
          token: ${{ steps.contract-reader.outputs.token }}
      - name: Verify exact committed Auth Hub source
        run: |
          git -C .auth-hub-source fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git -C .auth-hub-source rev-parse HEAD)" = "$(git -C .auth-hub-source rev-parse refs/remotes/origin/main)"
          python3 scripts/sync-control-plane-openapi.py --check --source-repo-dir .auth-hub-source --source-commit "${{ steps.auth-hub-lock.outputs.commit }}"

  upstream-exact-source-matrix:
    name: Build the exact-source matrix
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      # The matrix is derived from PRODUCTS in sync-vendored-openapi.py rather
      # than duplicated here, so a product cannot be vendored without also
      # being verified. Forgetting one used to be a silent, green omission.
      - id: build
        run: python3 scripts/gen-exact-source-matrix.py >> "$GITHUB_OUTPUT"

  upstream-exact-source:
    name: ${{ matrix.name }} source gate
    needs: upstream-exact-source-matrix
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.upstream-exact-source-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      # The lock is checked against the registry before any token is minted, so
      # a pull request cannot repoint a lock at a repository of its choosing
      # and have CI check it out with the contract reader's credentials.
      - name: Read allowlisted source lock
        id: source-lock
        env:
          LOCK_PATH: ${{ matrix.lock }}
          EXPECTED_REPO: tempera-dev/${{ matrix.repository }}
          EXPECTED_BRANCH: ${{ matrix.source_branch }}
          EXPECTED_PATH: ${{ matrix.source_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          lock = json.loads(Path(os.environ["LOCK_PATH"]).read_text(encoding="utf-8"))
          expected = {
              "source_repo": os.environ["EXPECTED_REPO"],
              "source_branch": os.environ["EXPECTED_BRANCH"],
              "source_path": os.environ["EXPECTED_PATH"],
          }
          for field, value in expected.items():
              if lock.get(field) != value:
                  raise SystemExit(f"refusing non-allowlisted {field}: {lock.get(field)!r}")
          commit = lock.get("source_commit", "")
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("source_commit must be a 40-character lowercase SHA")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"commit={commit}\n")
          PY
      - name: Mint private contract reader token
        id: contract-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: ${{ matrix.repository }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tempera-dev/${{ matrix.repository }}
          ref: ${{ steps.source-lock.outputs.commit }}
          fetch-depth: 0
          path: .upstream-source
          token: ${{ steps.contract-reader.outputs.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Reproduce and verify exact committed source
        env:
          PRODUCT: ${{ matrix.product }}
          SOURCE_BRANCH: ${{ matrix.source_branch }}
          TRANSFORM: ${{ matrix.transform }}
          COMMIT: ${{ steps.source-lock.outputs.commit }}
        run: |
          git -C .upstream-source fetch --no-tags origin "$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          case "$TRANSFORM" in
            yaml-json*) python3 -m pip install PyYAML==6.0.3 ;;
          esac
          python3 scripts/sync-vendored-openapi.py --check \
            --product "$PRODUCT" \
            --source-repo-dir .upstream-source \
            --source-branch "$SOURCE_BRANCH" \
            --source-commit "$COMMIT"

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/test-sync-data-engine-openapi.py
      - run: python3 scripts/test-gen-sdk-surface.py
      - run: python3 scripts/test-ci-yaml-dependencies.py
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/test-sync-vendored-openapi.py
      - run: python3 scripts/test-upstream-drift.py
      - run: python3 scripts/test-sdk-names.py
      - run: python3 scripts/test-aip-conformance.py
      - run: python3 scripts/check-aip-conformance.py
      - run: python3 scripts/gen-producer-tables.py --check
      - run: python3 scripts/check-exact-source-gaps.py
      - run: python3 scripts/sync-openapi-surface.py --check
      - run: python3 scripts/check-upstream-drift.py
      - run: python3 scripts/check-sdk-surface.py
      - run: python3 scripts/test-check-native-transport.py
      - run: python3 scripts/check-native-transport.py
      - run: python3 scripts/test-native-transport.py
      - run: npm --prefix packages/typescript test
      - name: Compile the public TypeScript merchant client
        run: npx --yes --package typescript@5.9.3 tsc packages/typescript/test/merchant-types.ts --noEmit --strict --module NodeNext --target ES2022 --lib ES2022,DOM
      - run: python3 -m unittest discover -s packages/python/tests
        env:
          PYTHONPATH: packages/python/src
      - run: cargo test --manifest-path packages/rust/Cargo.toml
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check native operation bindings
        run: python3 scripts/check-native-transport.py --client packages/swift/Sources/TemperaMerchantSDK/TemperaMerchantSDK.swift
      - name: Check Orders commerce operation bindings
        run: python3 scripts/check-native-transport.py --client packages/swift/Sources/TemperaMerchantSDK/OrdersCommerceClient.swift
      - name: Test Swift package with strict concurrency
        run: swift test -Xswiftc -strict-concurrency=complete
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read reviewed Orders producer lock
        id: orders-lock
        run: |
          python3 - <<'PYLOCK'
          import json, os, re
          from pathlib import Path
          lock = json.loads(Path("specs/tempera-dropshipping.openapi.json.source").read_text())
          expected = {"source_repo": "tempera-dev/tempera-dropshipping", "source_branch": "main", "source_path": "contracts/openapi/dropshipping.openapi.json"}
          if any(lock.get(key) != value for key, value in expected.items()):
              raise SystemExit("Orders source identity is not allowlisted")
          commit = lock.get("source_commit", "")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("Orders source requires an exact commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={commit}\n")
          PYLOCK
      - name: Mint Orders contract reader token
        id: orders-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TEMPERA_CONTRACT_READER_CLIENT_ID }}
          private-key: ${{ secrets.TEMPERA_CONTRACT_READER_PRIVATE_KEY }}
          owner: tempera-dev
          repositories: tempera-dropshipping
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tempera-dev/tempera-dropshipping
          ref: ${{ steps.orders-lock.outputs.commit }}
          fetch-depth: 0
          path: .orders-commerce-source
          token: ${{ steps.orders-reader.outputs.token }}
          persist-credentials: false
      - name: Verify Orders commit belongs to main
        run: git -C .orders-commerce-source merge-base --is-ancestor "${{ steps.orders-lock.outputs.commit }}" origin/main
      - name: Install exact Orders test dependencies
        run: python3 -m pip install -r .orders-commerce-source/requirements-test.txt
      - name: Test actual Swift commerce creation and durable replay
        run: python3 scripts/test-swift-commerce-creation.py --source-repo .orders-commerce-source --build-dir "$RUNNER_TEMP/SwiftCommerceHTTP"
        env:
          PYTHONDONTWRITEBYTECODE: "1"


  kotlin:
    name: kotlin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
      # The package has no wrapper committed, so the action's Gradle is used
      # deliberately rather than a wrapper nobody has verified.
      - name: Test the Kotlin package
        working-directory: packages/kotlin
        run: gradle --no-daemon test

  native:
    name: c and c++ packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Both packages are dependency-free by design, so they are built with a
      # bare compiler rather than a build system: if that stops working, the
      # packages have grown a dependency they were not supposed to have.
      - name: Build and test the C package
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Ipackages/c/include \
            packages/c/tests/test_tempera.c packages/c/src/*.c -o /tmp/tempera-c-tests
          /tmp/tempera-c-tests
      - name: Build and test the C++ package
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -pedantic -Ipackages/cpp/include \
            packages/cpp/tests/test_tempera.cpp -o /tmp/tempera-cpp-tests
          /tmp/tempera-cpp-tests
      - name: Build both under CMake
        run: |
          cmake -S packages/c -B /tmp/build-c && cmake --build /tmp/build-c
          cmake -S packages/cpp -B /tmp/build-cpp && cmake --build /tmp/build-cpp
